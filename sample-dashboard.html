<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample Dashboard | Work Artificial</title>
<meta name="description" content="Preview the Work Artificial AIOS dashboard — password protected sample.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23000000'/%3E%3Ccircle cx='32' cy='32' r='30' fill='none' stroke='%23ffffff' stroke-opacity='0.08' stroke-width='1'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23ff0011'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23ff0011' stroke-opacity='0.35' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600,700,800&display=swap">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#000; color:#fff;
    font-family:'Switzer', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 28px; flex-shrink:0;
  }
  .back-link{ color:rgba(255,255,255,0.5); font-size:13px; text-decoration:none; transition:color .2s ease; }
  .back-link:hover{ color:#fff; }

  main{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px 24px 80px;
  }
  h1{ font-size:26px; font-weight:500; letter-spacing:-0.01em; max-width:520px; }

  /* Static preview of the dashboard's real sign-in screen — for context only.
     The actual sign-in happens on the dashboard's own domain (see note below)
     because that's a hard browser requirement, not a design choice: a
     cross-origin iframe can't receive/send the session cookie the dashboard's
     login sets, since it's evaluated as a cross-site request from inside the
     frame. Rather than fake a working login here, the button opens the real
     thing directly, where its password protection works exactly as it does
     for anyone visiting it normally. */
  .dash-frame-hint{
    position:relative; width:100%; max-width:640px; margin:36px auto 0;
    aspect-ratio:1400/900; border-radius:16px; overflow:hidden;
    border:1px solid rgba(255,255,255,0.08); background:#0d0d0d;
    pointer-events:none;
  }
  .dash-frame-hint iframe{
    position:absolute; top:0; left:0; width:1400px; height:900px;
    border:none; transform-origin:top left;
  }
  .dash-frame-hint::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0) 55%, rgba(0,0,0,0.85) 100%);
  }

  .open-btn{
    display:inline-flex; align-items:center; gap:9px;
    background:#fff; color:#0a0a0a; border:none; border-radius:999px;
    font-family:inherit; font-weight:600; font-size:15px; padding:15px 30px;
    text-decoration:none; margin-top:28px;
    transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s ease;
    box-shadow:0 12px 32px rgba(0,0,0,0.4);
  }
  .open-btn:hover{ transform:translateY(-2px); box-shadow:0 16px 40px rgba(255,0,17,0.22); }
  .open-btn svg{ width:16px; height:16px; }

  p.note{ color:rgba(255,255,255,0.5); font-size:13px; margin-top:16px; max-width:420px; }

  @media (max-width:640px){
    h1{ font-size:21px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-link">← Back to Work Artificial</a>
  <span></span>
</header>

<main>
  <h1>This is the sample dashboard for you.</h1>

  <div class="dash-frame-hint" aria-hidden="true">
    <iframe src="https://wa-aios.vercel.app/" tabindex="-1" loading="lazy"></iframe>
  </div>

  <a class="open-btn" href="https://wa-aios.vercel.app/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
    Open Sample Dashboard
  </a>
</main>

<script>
  (function(){
    var wrap = document.querySelector('.dash-frame-hint');
    var iframe = wrap && wrap.querySelector('iframe');
    function scale(){
      if(!iframe) return;
      var w = wrap.clientWidth;
      if(w > 0) iframe.style.transform = 'scale(' + (w/1400) + ')';
    }
    if(typeof ResizeObserver !== 'undefined' && wrap){
      new ResizeObserver(scale).observe(wrap);
    } else {
      window.addEventListener('resize', scale);
    }
    scale();
  })();
</script>

</body>
</html>
